<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<title>Maze Trace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* Layout: one column, board centered, stats above, controls below. Single committed dark look. */
  :root {
    --ink: #0f1220;
    --board: #171b2c;
    --wall: #c8cfe4;
    --trail: #ffb347;
    --goal: #6fd3c7;
    --key: #ffe066;
    --ghost: #ff5d73;
    --gate: #9b8cff;
    --muted: #7d86a3;
    --display: "Bungee", "Impact", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink);
    color: var(--wall);
    font-family: var(--mono);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  .wrap {
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px;
    padding-inline: 16px;
    padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-bottom, 0px));
    box-sizing: border-box;
    touch-action: none;
  }
  header {
    width: 100%; max-width: 560px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap;
  }
  h1 { font-family: var(--display); font-weight: 400; font-size: 1.6rem; margin: 0; color: var(--trail); letter-spacing: .02em; }
  .stats { display: flex; gap: 14px; font-variant-numeric: tabular-nums; font-size: .9rem; flex-wrap: wrap; }
  .stats b { color: var(--goal); font-weight: 600; }
  .stats .lives { color: var(--ghost); letter-spacing: .1em; }
  .stats b.low { color: var(--ghost); }
  .stage { position: relative; width: 100%; max-width: min(560px, calc(100vh - 230px)); }
  canvas {
    display: block; width: 100%; aspect-ratio: 1; max-width: 100%;
    background: var(--board); border-radius: 10px;
  }
  .dragging { cursor: grabbing; }
  .rule {
    width: 100%; max-width: 560px; margin: 0; min-height: 2.6em;
    font-size: .85rem; text-align: center; color: var(--muted);
  }
  .rule strong { color: var(--key); font-weight: 600; }
  .controls { display: flex; gap: 10px; }
  button {
    font: 600 .95rem var(--mono);
    background: transparent; color: var(--wall);
    border: 1.5px solid var(--muted); border-radius: 8px;
    padding: 10px 16px; cursor: pointer;
    touch-action: manipulation;
  }
  button:hover { border-color: var(--wall); }
  button:focus-visible { outline: 2px solid var(--goal); outline-offset: 2px; }
  button.primary { background: var(--trail); color: var(--ink); border-color: var(--trail); }
  .overlay {
    position: absolute; inset: 0; border-radius: 10px;
    background: color-mix(in srgb, var(--ink) 84%, transparent);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    text-align: center; padding: 16px;
  }
  .overlay[hidden] { display: none; }
  .overlay h2 { font-family: var(--display); font-weight: 400; font-size: 2.1rem; margin: 0; color: var(--goal); }
  .overlay h2.bad { color: var(--ghost); }
  .overlay p { margin: 0; font-size: .95rem; max-width: 30ch; }
  .menu h2 { color: var(--trail); }
  .pick { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .pick span { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .seg { display: flex; border: 1.5px solid var(--muted); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 9px 14px; font-size: .9rem; }
  .seg button + button { border-left: 1.5px solid var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--goal); color: var(--ink); }
  .menu .desc { font-size: .8rem; color: var(--muted); min-height: 2.4em; }
  .flash { animation: flash .4s ease-out; }
  @keyframes flash { from { box-shadow: 0 0 0 6px var(--ghost); } to { box-shadow: 0 0 0 0 transparent; } }
  @media (prefers-reduced-motion: reduce) { .flash { animation: none; } }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <h1>Maze Trace</h1>
    <div class="stats">
      <span>Lvl <b id="lvl">1</b></span>
      <span id="timeLabel">Time <b id="time">0.0</b>s</span>
      <span class="lives" id="lives" aria-label="Lives"></span>
    </div>
  </header>
  <div class="stage">
    <canvas id="board" aria-label="Maze board. Drag anywhere to steer the orange dot to the teal ring."></canvas>
    <div class="overlay" id="overlay" hidden>
      <h2 id="ovTitle"></h2>
      <p id="ovText"></p>
      <button class="primary" id="ovBtn"></button>
    </div>
    <div class="overlay menu" id="menu">
      <h2>Maze Trace</h2>
      <div class="pick">
        <span>Difficulty</span>
        <div class="seg" id="diffSeg">
          <button data-v="easy">Easy</button><button data-v="normal">Normal</button><button data-v="hard">Hard</button>
        </div>
      </div>
      <div class="pick">
        <span>Maze size</span>
        <div class="seg" id="sizeSeg">
          <button data-v="small">Small</button><button data-v="medium">Medium</button><button data-v="large">Large</button>
        </div>
      </div>
      <p class="desc" id="menuDesc"></p>
      <button class="primary" id="startBtn">Start</button>
    </div>
  </div>
  <p class="rule" id="rule"></p>
  <div class="controls">
    <button id="menuBtn">Menu</button>
    <button id="restartBtn">Restart level</button>
    <button id="newBtn">New maze</button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('board');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const C = {
    wall: css('--wall'), trail: css('--trail'), goal: css('--goal'), key: css('--key'),
    ghost: css('--ghost'), gate: css('--gate'), ink: css('--ink'), board: css('--board'), muted: css('--muted'),
  };

  const SENSITIVITY = 1.15;   // dot distance per pixel of finger movement
  const PAD = 10;
  const MAX_LIVES = 5;

  // Wall bits per cell
  const N = 1, E = 2, S = 4, W = 8;
  const DIRS = [[0,-1,N,S],[1,0,E,W],[0,1,S,N],[-1,0,W,E]];

  // Each level mixes in a twist. The maze stays small; the twists make it hard.
  const LEVELS = [
    { size: 7,  msg: 'Drag anywhere. Get the dot to the teal ring.' },
    { size: 7,  keys: 2, msg: '<strong>Keys:</strong> grab every key to unlock the exit.' },
    { size: 8,  ghosts: 1, loops: .15, msg: '<strong>Ghost!</strong> Touch it and you lose a life.' },
    { size: 8,  fog: 2.3, msg: '<strong>Lights out.</strong> You can only see around you.' },
    { size: 8,  gates: 3, msg: '<strong>Gates</strong> open and close. Time your run.' },
    { size: 9,  keys: 3, ghosts: 1, loops: .15, msg: 'Keys <strong>and</strong> a ghost.' },
    { size: 9,  timer: 25, keys: 2, msg: '<strong>Beat the clock.</strong> Run out and you lose a life.' },
    { size: 9,  ghosts: 2, loops: .2, msg: '<strong>Two ghosts.</strong> Use the loops to dodge.' },
    { size: 9,  fog: 2.3, keys: 3, msg: 'Find the keys in the dark.' },
    { size: 10, gates: 4, ghosts: 1, loops: .15, msg: 'Gates <strong>and</strong> a ghost.' },
  ];
  const DIFF = {
    easy:   { lives: 5, ghostSpeed: 1.15, chase: .15, timer: 1.6, fog: 1, gate: 1.4, extraKeys: 0, extraGhosts: 0,
              desc: '5 lives. Slow ghosts, more time, bigger light.' },
    normal: { lives: 3, ghostSpeed: 1.7, chase: .35, timer: 1, fog: 0, gate: 1, extraKeys: 0, extraGhosts: 0,
              desc: '3 lives. The standard game.' },
    hard:   { lives: 2, ghostSpeed: 2.3, chase: .6, timer: .75, fog: -.5, gate: .75, extraKeys: 1, extraGhosts: 1,
              desc: '2 lives. Fast hunting ghosts, extra keys, less time.' },
  };
  const SIZES = { small: -2, medium: 0, large: 4 };
  const SIZE_DESC = { small: 'Quick mazes.', medium: 'Regular mazes.', large: 'Long mazes.' };
  let settings = { diff: 'normal', size: 'medium' };
  try { Object.assign(settings, JSON.parse(localStorage.getItem('maze-settings')) || {}); } catch (e) {}
  if (!DIFF[settings.diff]) settings.diff = 'normal';
  if (!(settings.size in SIZES)) settings.size = 'medium';

  // Apply the chosen difficulty and size on top of the level's twists
  function levelSpec(l) {
    const base = baseSpec(l), d = DIFF[settings.diff];
    const sz = Math.max(5, base.size + SIZES[settings.size]);
    const grow = sz / base.size;
    return {
      ...base,
      size: sz,
      keys: base.keys ? base.keys + d.extraKeys + (grow > 1.2 ? 1 : 0) : 0,
      ghosts: base.ghosts ? base.ghosts + d.extraGhosts + (grow > 1.2 ? 1 : 0) : 0,
      timer: base.timer ? Math.round(base.timer * d.timer * Math.pow(grow, 1.6)) : 0,
      fog: base.fog ? base.fog + d.fog : 0,
      gates: base.gates ? Math.round(base.gates * Math.max(1, grow)) : 0,
      gateScale: d.gate,
      ghostSpeed: d.ghostSpeed * (base.speedUp || 1),
      chase: d.chase,
    };
  }
  function baseSpec(l) {
    if (l <= LEVELS.length) return LEVELS[l - 1];
    // Endless mode: random combos, capped size, faster ghosts
    const r = () => Math.random();
    const spec = { size: 10 + (r() < .5 ? 1 : 0), loops: .18, keys: 2 + Math.floor(r() * 3) };
    spec.ghosts = 1 + Math.floor(r() * Math.min(3, 1 + (l - 10) / 3));
    if (r() < .4) spec.fog = 2.5;
    if (r() < .4) spec.gates = 3 + Math.floor(r() * 3);
    if (r() < .4) spec.timer = 30;
    spec.speedUp = Math.min(1.8, 1 + (l - 10) * .05);
    spec.msg = 'Endless mode. Everything goes.';
    return spec;
  }

  let spec, size, grid, pos, trail, goal, level = 1, lives = 3;
  const startLives = () => DIFF[settings.diff].lives;
  let keys = [], ghosts = [], gates = [];
  let started = false, done = false, startTime = 0, elapsed = 0, invulnUntil = 0;
  let dragging = false, lastPt = null, px = 0, now = 0;

  function rnd(n) { return Math.floor(Math.random() * n); }

  function makeMaze(n, loops) {
    const g = Array.from({ length: n }, () => Array(n).fill(15));
    const seen = Array.from({ length: n }, () => Array(n).fill(false));
    const stack = [[0, 0]];
    seen[0][0] = true;
    while (stack.length) {
      const [x, y] = stack[stack.length - 1];
      const opts = DIRS.filter(([dx, dy]) => {
        const nx = x + dx, ny = y + dy;
        return nx >= 0 && ny >= 0 && nx < n && ny < n && !seen[ny][nx];
      });
      if (!opts.length) { stack.pop(); continue; }
      const [dx, dy, b, ob] = opts[rnd(opts.length)];
      const nx = x + dx, ny = y + dy;
      g[y][x] &= ~b; g[ny][nx] &= ~ob;
      seen[ny][nx] = true;
      stack.push([nx, ny]);
    }
    // Knock out some extra walls so there are loops (needed to dodge ghosts)
    const extra = Math.round(n * n * (loops || 0));
    for (let i = 0; i < extra; i++) {
      const x = rnd(n), y = rnd(n), [dx, dy, b, ob] = DIRS[rnd(4)];
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= n || ny >= n) continue;
      g[y][x] &= ~b; g[ny][nx] &= ~ob;
    }
    return g;
  }

  // Maze passage check, ignoring gates
  function passage(x, y, dx, dy) {
    const d = DIRS.find(d => d[0] === dx && d[1] === dy);
    return !!d && !(grid[y][x] & d[2]);
  }
  function gateAt(x, y, dx, dy) {
    return gates.find(g => (g.x === x && g.y === y && g.dx === dx && g.dy === dy) ||
                           (g.x === x + dx && g.y === y + dy && g.dx === -dx && g.dy === -dy));
  }
  function gateClosed(g) { return ((now + g.phase) % g.period) > g.period * .5; }
  function isOpen(x, y, dx, dy) {
    if (!passage(x, y, dx, dy)) return false;
    const g = gates.length && gateAt(x, y, dx, dy);
    return !g || !gateClosed(g);
  }

  function bfs(from) {
    const dist = Array.from({ length: size }, () => Array(size).fill(-1));
    const prev = {};
    const q = [from]; dist[from.y][from.x] = 0;
    while (q.length) {
      const c = q.shift();
      for (const [dx, dy] of DIRS) {
        if (!passage(c.x, c.y, dx, dy)) continue;
        const nx = c.x + dx, ny = c.y + dy;
        if (dist[ny][nx] < 0) { dist[ny][nx] = dist[c.y][c.x] + 1; prev[nx + ',' + ny] = c; q.push({ x: nx, y: ny }); }
      }
    }
    return { dist, prev };
  }

  function setupLevel(keepMaze) {
    spec = levelSpec(level);
    size = spec.size;
    if (!keepMaze || !grid || grid.length !== size) {
      grid = makeMaze(size, spec.loops);
      buildExtras();
    } else {
      keys.forEach(k => k.got = false);
    }
    pos = { x: 0, y: 0 };
    trail = [{ x: 0, y: 0 }];
    started = false; done = false; elapsed = 0; invulnUntil = 0;
    placeGhosts();
    $('lvl').textContent = level;
    $('rule').innerHTML = spec.msg;
    $('overlay').hidden = true;
    updateHud();
  }

  function buildExtras() {
    goal = { x: size - 1, y: size - 1 };
    const { dist, prev } = bfs({ x: 0, y: 0 });
    // Keys: spread out, away from start and exit
    keys = [];
    const cells = [];
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) cells.push({ x, y, d: dist[y][x] });
    const pool = cells.filter(c => c.d >= 3 && !(c.x === goal.x && c.y === goal.y));
    for (let i = 0; i < (spec.keys || 0) && pool.length; i++) {
      pool.sort((a, b) => minKeyDist(b) - minKeyDist(a) + (Math.random() - .5) * 3);
      const c = pool.shift();
      keys.push({ x: c.x, y: c.y, got: false });
    }
    function minKeyDist(c) {
      const others = [...keys, { x: 0, y: 0 }, goal];
      return Math.min(...others.map(k => Math.abs(k.x - c.x) + Math.abs(k.y - c.y)));
    }
    // Gates: put them on the solution path so you can't avoid them
    gates = [];
    if (spec.gates) {
      const path = [goal];
      while (path[0].x || path[0].y) path.unshift(prev[path[0].x + ',' + path[0].y]);
      const spots = [];
      for (let i = 2; i < path.length - 1; i++) spots.push(i);
      spots.sort(() => Math.random() - .5);
      spots.slice(0, spec.gates).forEach(i => {
        const a = path[i - 1], b = path[i];
        gates.push({ x: a.x, y: a.y, dx: b.x - a.x, dy: b.y - a.y, period: (2600 + rnd(1400)) * spec.gateScale, phase: rnd(4000) });
      });
    }
  }

  function placeGhosts() {
    ghosts = [];
    const { dist } = bfs({ x: 0, y: 0 });
    const far = [];
    let minD = Math.round(size * 1.4);
    for (; minD > 2 && !far.length; minD--) {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++)
        if (dist[y][x] >= minD && Math.abs(x) + Math.abs(y) >= size / 2) far.push({ x, y });
    }
    for (let i = 0; i < (spec.ghosts || 0) && far.length; i++) {
      const c = far.splice(rnd(far.length), 1)[0];
      ghosts.push({ x: c.x, y: c.y, fx: c.x, fy: c.y, tx: c.x, ty: c.y, speed: spec.ghostSpeed });
    }
  }

  function moveGhost(g, dt) {
    if (g.x === g.tx && g.y === g.ty) {
      // Pick next cell: no U-turns unless it's a dead end; lean toward the player a bit
      let opts = DIRS.filter(([dx, dy]) => passage(g.x, g.y, dx, dy))
        .map(([dx, dy]) => ({ x: g.x + dx, y: g.y + dy }));
      const fwd = opts.filter(o => !(o.x === g.fx && o.y === g.fy));
      if (fwd.length) opts = fwd;
      let pick = opts[rnd(opts.length)];
      if (Math.random() < spec.chase) pick = opts.reduce((p, o) =>
        Math.hypot(o.x - pos.x, o.y - pos.y) < Math.hypot(p.x - pos.x, p.y - pos.y) ? o : p);
      g.fx = g.x; g.fy = g.y; g.tx = pick.x; g.ty = pick.y;
    }
    const s = g.speed * dt;
    const dx = g.tx - g.x, dy = g.ty - g.y, d = Math.hypot(dx, dy);
    if (d <= s) { g.x = g.tx; g.y = g.ty; }
    else { g.x += dx / d * s; g.y += dy / d * s; }
  }

  function cellPx() { return (px - PAD * 2) / size; }

  function resize() {
    const r = cv.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.width * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    px = r.width;
  }

  function allKeys() { return keys.every(k => k.got); }

  function draw() {
    if (!grid || !px) return;
    const cell = cellPx();
    const cx = v => PAD + (v + 0.5) * cell;
    ctx.clearRect(0, 0, px, px);

    // exit: ring when open, ring with a padlock bar when locked
    const open = allKeys();
    ctx.strokeStyle = open ? C.goal : C.muted; ctx.lineWidth = Math.max(2, cell * 0.12);
    ctx.beginPath(); ctx.arc(cx(goal.x), cx(goal.y), cell * 0.28, 0, Math.PI * 2); ctx.stroke();
    if (!open) {
      ctx.fillStyle = C.muted;
      ctx.fillRect(cx(goal.x) - cell * .14, cx(goal.y) - cell * .06, cell * .28, cell * .12);
    }

    // trail
    ctx.strokeStyle = C.trail; ctx.globalAlpha = 0.45;
    ctx.lineWidth = cell * 0.32; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    trail.forEach((p, i) => i ? ctx.lineTo(cx(p.x), cx(p.y)) : ctx.moveTo(cx(p.x), cx(p.y)));
    ctx.lineTo(cx(pos.x), cx(pos.y));
    ctx.stroke(); ctx.globalAlpha = 1;

    // keys (diamonds)
    ctx.fillStyle = C.key;
    keys.forEach(k => {
      if (k.got) return;
      const x = cx(k.x), y = cx(k.y), r = cell * .22;
      ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r * .8, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r * .8, y); ctx.closePath(); ctx.fill();
    });

    // walls
    ctx.strokeStyle = C.wall; ctx.lineWidth = Math.max(2, cell * 0.1); ctx.lineCap = 'round';
    ctx.beginPath();
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const v = grid[y][x], X = PAD + x * cell, Y = PAD + y * cell;
      if (v & N) { ctx.moveTo(X, Y); ctx.lineTo(X + cell, Y); }
      if (v & W) { ctx.moveTo(X, Y); ctx.lineTo(X, Y + cell); }
      if (y === size - 1 && v & S) { ctx.moveTo(X, Y + cell); ctx.lineTo(X + cell, Y + cell); }
      if (x === size - 1 && v & E) { ctx.moveTo(X + cell, Y); ctx.lineTo(X + cell, Y + cell); }
    }
    ctx.stroke();

    // gates: solid bar when closed, faint when open, blinking just before closing
    gates.forEach(g => {
      const t = (now + g.phase) % g.period, closed = t > g.period * .5;
      const warn = !closed && t > g.period * .5 - 500;
      ctx.strokeStyle = C.gate; ctx.lineWidth = Math.max(3, cell * .14);
      ctx.globalAlpha = closed ? 1 : warn ? (Math.floor(now / 100) % 2 ? .9 : .25) : .3;
      const mx = cx(g.x) + g.dx * cell / 2, my = cx(g.y) + g.dy * cell / 2;
      ctx.beginPath();
      if (g.dx) { ctx.moveTo(mx, my - cell * .42); ctx.lineTo(mx, my + cell * .42); }
      else { ctx.moveTo(mx - cell * .42, my); ctx.lineTo(mx + cell * .42, my); }
      ctx.stroke();
    });
    ctx.globalAlpha = 1;

    // ghosts
    ghosts.forEach(g => {
      const x = cx(g.x), y = cx(g.y), r = cell * .3;
      ctx.fillStyle = C.ghost;
      ctx.beginPath();
      ctx.arc(x, y - r * .1, r, Math.PI, 0);
      ctx.lineTo(x + r, y + r * .8);
      for (let i = 0; i < 3; i++) {
        ctx.lineTo(x + r - (i + .5) * (2 * r / 3), y + r * (i % 2 ? .8 : .45));
      }
      ctx.lineTo(x - r, y + r * .8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = C.ink;
      ctx.beginPath(); ctx.arc(x - r * .35, y - r * .15, r * .16, 0, 7); ctx.arc(x + r * .35, y - r * .15, r * .16, 0, 7); ctx.fill();
    });

    // player (blinks while invulnerable)
    if (now > invulnUntil || Math.floor(now / 120) % 2) {
      ctx.fillStyle = C.trail;
      ctx.shadowColor = C.trail; ctx.shadowBlur = dragging ? 18 : 8;
      ctx.beginPath(); ctx.arc(cx(pos.x), cx(pos.y), cell * 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // fog of war
    if (spec.fog) {
      const r = spec.fog * cell;
      const grad = ctx.createRadialGradient(cx(pos.x), cx(pos.y), r * .45, cx(pos.x), cx(pos.y), r);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, C.board);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, px, px);
      // keep the exit visible as a faint beacon
      ctx.strokeStyle = allKeys() ? C.goal : C.muted; ctx.globalAlpha = .5; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx(goal.x), cx(goal.y), cell * 0.28, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // The dot rides on rails between cell centres. If your finger points into a wall,
  // it slides toward the nearest turn that goes your way, so you never get stuck on a corner.
  function step(mx, my) {
    const len = Math.hypot(mx, my);
    if (!len) return;
    const rx = Math.round(pos.x), ry = Math.round(pos.y);
    const onX = Math.abs(pos.x - rx) < 1e-9, onY = Math.abs(pos.y - ry) < 1e-9;
    const sx = Math.sign(mx), sy = Math.sign(my);
    const horizFirst = Math.abs(mx) >= Math.abs(my);

    if (onX && onY) {
      pos.x = rx; pos.y = ry;
      const tries = horizFirst ? [[sx, 0], [0, sy]] : [[0, sy], [sx, 0]];
      for (const [dx, dy] of tries) {
        if ((dx || dy) && isOpen(rx, ry, dx, dy)) { pos.x += dx * len; pos.y += dy * len; return; }
      }
      return;
    }

    if (onY) { // on a horizontal corridor
      pos.y = ry;
      const a = Math.floor(pos.x), b = a + 1;
      let target = null;
      if (horizFirst) target = sx > 0 ? b : a;
      else {
        const ok = [a, b].filter(n => isOpen(n, ry, 0, sy));
        if (ok.length) target = ok.reduce((p, n) => Math.abs(n - pos.x) < Math.abs(p - pos.x) ? n : p);
        else if (sx) target = sx > 0 ? b : a;
      }
      if (target === null) return;
      pos.x = Math.abs(target - pos.x) <= len ? target : pos.x + Math.sign(target - pos.x) * len;
      return;
    }

    if (onX) { // on a vertical corridor
      pos.x = rx;
      const a = Math.floor(pos.y), b = a + 1;
      let target = null;
      if (!horizFirst) target = sy > 0 ? b : a;
      else {
        const ok = [a, b].filter(n => isOpen(rx, n, sx, 0));
        if (ok.length) target = ok.reduce((p, n) => Math.abs(n - pos.y) < Math.abs(p - pos.y) ? n : p);
        else if (sy) target = sy > 0 ? b : a;
      }
      if (target === null) return;
      pos.y = Math.abs(target - pos.y) <= len ? target : pos.y + Math.sign(target - pos.y) * len;
    }
  }

  function arrived() {
    if (!Number.isInteger(pos.x) || !Number.isInteger(pos.y)) return;
    const last = trail[trail.length - 1];
    if (last.x === pos.x && last.y === pos.y) return;
    const prev = trail[trail.length - 2];
    if (prev && prev.x === pos.x && prev.y === pos.y) trail.pop(); // backtracking erases trail
    else trail.push({ x: pos.x, y: pos.y });
    keys.forEach(k => { if (!k.got && k.x === pos.x && k.y === pos.y) k.got = true; });
    if (pos.x === goal.x && pos.y === goal.y && allKeys()) win();
  }

  function move(dxPx, dyPx) {
    if (done) return;
    const cell = cellPx();
    let mx = dxPx / cell * SENSITIVITY, my = dyPx / cell * SENSITIVITY;
    const n = Math.max(1, Math.ceil(Math.hypot(mx, my) / 0.04));
    mx /= n; my /= n;
    for (let i = 0; i < n && !done; i++) { step(mx, my); arrived(); }
    if (!started && (pos.x || pos.y)) { started = true; startTime = now; }
  }

  function hit(reason) {
    lives--;
    cv.classList.remove('flash'); void cv.offsetWidth; cv.classList.add('flash');
    if (navigator.vibrate) try { navigator.vibrate(120); } catch (e) {}
    if (lives <= 0) { gameOver(reason); return; }
    pos = { x: 0, y: 0 };
    trail = [{ x: 0, y: 0 }];
    invulnUntil = now + 1500;
    if (spec.timer) startTime = now;
    placeGhosts();
    updateHud();
  }

  function updateHud() {
    $('lives').textContent = '♥'.repeat(Math.max(0, lives)) + '♡'.repeat(Math.max(0, startLives() - lives));
    const t = $('time');
    if (spec.timer) {
      const left = Math.max(0, spec.timer - (started ? elapsed : 0));
      $('timeLabel').firstChild.textContent = 'Left ';
      t.textContent = left.toFixed(1);
      t.classList.toggle('low', left < 6);
    } else {
      $('timeLabel').firstChild.textContent = 'Time ';
      t.textContent = (started ? elapsed : 0).toFixed(1);
      t.classList.remove('low');
    }
  }

  function showOverlay(title, text, btn, bad) {
    $('ovTitle').textContent = title;
    $('ovTitle').classList.toggle('bad', !!bad);
    $('ovText').textContent = text;
    $('ovBtn').textContent = btn;
    $('overlay').hidden = false;
    $('ovBtn').focus();
  }

  function win() {
    done = true; dragging = false;
    document.body.classList.remove('dragging');
    let bonus = '';
    if (level % 3 === 0 && lives < MAX_LIVES) { lives++; bonus = ' +1 life!'; }
    updateHud();
    showOverlay('Escaped', `Level ${level} in ${elapsed.toFixed(1)}s.${bonus}`, 'Next level');
    $('ovBtn').onclick = () => { level++; setupLevel(false); };
  }

  function gameOver(reason) {
    done = true; dragging = false;
    document.body.classList.remove('dragging');
    let best = level;
    try {
      const k = 'maze-best-' + settings.diff + '-' + settings.size;
      best = Math.max(level, parseInt(localStorage.getItem(k)) || 0);
      localStorage.setItem(k, best);
    } catch (e) {}
    updateHud();
    showOverlay(reason === 'time' ? 'Out of time' : 'Caught', `You reached level ${level}. Best: level ${best}.`, 'Play again', true);
    $('ovBtn').onclick = () => { level = 1; lives = startLives(); setupLevel(false); };
  }

  let lastFrame = performance.now();
  function frame(t) {
    const dt = Math.min(.05, (t - lastFrame) / 1000);
    lastFrame = t; now = t;
    if (!done && started) {
      elapsed = (now - startTime) / 1000;
      ghosts.forEach(g => moveGhost(g, dt));
      if (now > invulnUntil && ghosts.some(g => Math.hypot(g.x - pos.x, g.y - pos.y) < .6)) hit('ghost');
      else if (spec.timer && elapsed >= spec.timer) hit('time');
      updateHud();
    }
    draw();
    requestAnimationFrame(frame);
  }

  // Drag anywhere on the page, so your finger never hides the maze.
  const wrap = $('wrap');
  wrap.addEventListener('pointerdown', e => {
    if (done || e.target.closest('button')) return;
    e.preventDefault();
    dragging = true; lastPt = { x: e.clientX, y: e.clientY };
    wrap.setPointerCapture(e.pointerId);
    document.body.classList.add('dragging');
  });
  wrap.addEventListener('pointermove', e => {
    if (!dragging || done) return;
    move(e.clientX - lastPt.x, e.clientY - lastPt.y);
    lastPt = { x: e.clientX, y: e.clientY };
  });
  const release = () => { dragging = false; document.body.classList.remove('dragging'); };
  wrap.addEventListener('pointerup', release);
  wrap.addEventListener('pointercancel', release);

  // Arrow keys / WASD on a computer
  const KEYS = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0], w: [0,-1], s: [0,1], a: [-1,0], d: [1,0] };
  window.addEventListener('keydown', e => {
    const k = KEYS[e.key]; if (!k || done) return;
    e.preventDefault();
    const c = cellPx() / SENSITIVITY / 3;
    move(k[0] * c, k[1] * c);
  });

  const menu = $('menu');
  const fresh = () => { if (lives <= 0) { level = 1; lives = startLives(); return true; } };
  $('newBtn').addEventListener('click', () => { if (!menu.hidden) return; fresh(); setupLevel(false); });
  $('restartBtn').addEventListener('click', () => { if (!menu.hidden) return; setupLevel(!fresh()); });
  window.addEventListener('resize', resize);

  // Start menu
  function syncMenu() {
    [['diffSeg', 'diff'], ['sizeSeg', 'size']].forEach(([id, key]) =>
      $(id).querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === settings[key])));
    let best = 0;
    try { best = parseInt(localStorage.getItem('maze-best-' + settings.diff + '-' + settings.size)) || 0; } catch (e) {}
    $('menuDesc').textContent = DIFF[settings.diff].desc + ' ' + SIZE_DESC[settings.size] + (best ? ` Best: level ${best}.` : '');
  }
  [['diffSeg', 'diff'], ['sizeSeg', 'size']].forEach(([id, key]) =>
    $(id).addEventListener('click', e => { const b = e.target.closest('button'); if (b) { settings[key] = b.dataset.v; syncMenu(); } }));
  function openMenu() { done = true; dragging = false; $('overlay').hidden = true; menu.hidden = false; syncMenu(); $('startBtn').focus(); }
  $('menuBtn').addEventListener('click', openMenu);
  $('startBtn').addEventListener('click', () => {
    try { localStorage.setItem('maze-settings', JSON.stringify(settings)); } catch (e) {}
    menu.hidden = true;
    level = 1; lives = startLives();
    setupLevel(false);
  });

  lives = startLives();
  setupLevel(false);
  openMenu();
  resize();
  document.fonts && document.fonts.ready.then(resize);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
